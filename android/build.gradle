group 'com.example.flutter_opengl'
version '0.0.1'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.example.flutter_opengl'

    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk 24

        externalNativeBuild {
            cmake {
                arguments '-DBUILD_TESTING=OFF',
                        '-DANDROID_TOOLCHAIN=clang',
                        '-DANDROID_STL=c++_shared'
                cppFlags "-std=c++17 -fexceptions -frtti"
            }
        }

        // Only build for ABIs that we supply a Rust library for
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }
}

// -----------------------------------------------------------------------
// Cargo NDK build task
//
// Builds the Rust shared library for all Android ABIs before CMake runs.
// Requires:
//   - Rust toolchain installed (rustup)
//   - Android NDK targets: rustup target add aarch64-linux-android
//         armv7-linux-androideabi i686-linux-android x86_64-linux-android
//   - cargo-ndk: cargo install cargo-ndk
// -----------------------------------------------------------------------

def rustDir = file("${projectDir}/../rust")

// Map of Android ABIs to Rust target triples
def abiTargets = [
    'arm64-v8a'   : 'aarch64-linux-android',
    'armeabi-v7a' : 'armv7-linux-androideabi',
    'x86'         : 'i686-linux-android',
    'x86_64'      : 'x86_64-linux-android',
]

task cargoNdkBuild {
    description = 'Build the Rust shared library for all Android ABIs using cargo-ndk'

    // Input: all Rust source files
    inputs.dir(file("${rustDir}/src"))
    inputs.file(file("${rustDir}/Cargo.toml"))

    // Output: the built .so files
    abiTargets.each { abi, target ->
        outputs.file(file("${rustDir}/target/${target}/release/libflutter_opengl_rust.so"))
    }

    doLast {
        // Resolve the NDK directory from the Android SDK
        def ndkDir = android.ndkDirectory
        if (ndkDir == null) {
            throw new GradleException("Android NDK not found. Set ndk.dir in local.properties or ANDROID_NDK_HOME.")
        }

        abiTargets.each { abi, target ->
            exec {
                workingDir rustDir
                environment 'ANDROID_NDK_HOME', ndkDir.absolutePath
                commandLine 'cargo', 'ndk',
                    '--target', target,
                    '--platform', '24',
                    '--',
                    'build', '--release'
            }
        }
    }
}

// Ensure Rust library is built before CMake runs
tasks.whenTaskAdded { task ->
    if (task.name.contains('externalNativeBuild') || task.name.contains('ExternalNativeBuild')) {
        task.dependsOn cargoNdkBuild
    }
}

// Also hook into the main build
tasks.matching { it.name == 'preBuild' }.configureEach {
    it.dependsOn cargoNdkBuild
}
